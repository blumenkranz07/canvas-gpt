[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[project]
name = "canvas-gpt"
version = "0.1.0"
description = "Branch, connect, and merge AI conversations from your terminal."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "Canvas GPT contributors" }]
keywords = ["ai", "cli", "llm", "openai", "anthropic", "graph"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Environment :: Console",
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
]
dependencies = [
  "anthropic>=0.70.0,<1",
  "openai>=2.0.0,<3",
]

[project.optional-dependencies]
dev = ["pytest>=8.0", "pytest-cov>=5.0"]
desktop = ["pywebview>=6.2,<7"]
build = ["pyinstaller>=6.0,<7"]

[project.scripts]
canvas-gpt = "canvas_gpt.cli:entrypoint"
cc = "canvas_gpt.cli:entrypoint"
canvas-gpt-desktop = "canvas_gpt.desktop:entrypoint"

[tool.hatch.build.targets.wheel]
packages = ["src/canvas_gpt"]

[tool.pytest.ini_options]
addopts = "-q"
testpaths = ["tests"]
